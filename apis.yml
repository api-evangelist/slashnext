aid: slashnext
name: SlashNext
description: >-
  SlashNext is an AI-native phishing and social-engineering threat detection
  company founded by Atif Mushtaq (an architect of FireEye's core malware
  sandbox). Its Real-Time Phishing Threat Intelligence is delivered through the
  SlashNext On-demand Threat Intelligence (OTI) REST API at
  oti.slashnext.cloud, which offers URL and host reputation lookups, real-time
  cloud SEER-engine URL scanning in both asynchronous and blocking modes, and
  forensic downloads (screenshot, HTML, and rendered text) keyed by scan id,
  plus per-tenant API quota status. Responses are available as JSON, CSV, or
  plaintext and every request authenticates with a per-tenant API key passed as
  the authkey parameter. SlashNext was acquired by Varonis Systems in August
  2025 and its detection capabilities are being integrated into the Varonis
  Email Security and MDDR platform.
